name: 2 - Post Office Data

on:
  workflow_dispatch:

jobs:
  Run-Post-Office-Functions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .
            scripts
            postoffice
          sparse-checkout-cone-mode: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Post Office functions
        run: bun run osm:postoffice
        env:
          OVERPASS_CH_KEY: ${{ secrets.OVERPASS_CH_KEY }}
