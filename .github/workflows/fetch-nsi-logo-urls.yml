name: Fetch NSI logo URLs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-logos:
    name: Download and extract NSI logos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Show Bun version
        run: bun --version

      - name: Fetch logo URLs
        working-directory: NSI
        run: bun fetch-nsi-logos.ts

      - name: Commit changes
        working-directory: NSI
        run: |
          if git diff --quiet -- NSI/nsi-logos.json; then
            echo "No logo changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add NSI/nsi-logos.json
          git commit -m "Update NSI logo URLs"
          git push
