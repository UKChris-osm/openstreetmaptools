name: Fetch NSI logo URLs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-nsi-logo-urls:
    name: Fetch NSI logo URLs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Show Bun version
        run: bun --version

      - name: Fetch NSI logo URLs
        working-directory: NSI
        run: bun fetch-nsi-logos.ts

      - name: Copy logo URLs for GitHub Pages
        run: |
          mkdir -p docs
          cp NSI/nsi-logos.json docs/nsi-logos.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add NSI/nsi-logos.json docs/nsi-logos.json

          if git diff --cached --quiet; then
            echo "No logo URL changes detected"
            exit 0
          fi

          git commit -m "Update NSI logo URLs"
          git push
